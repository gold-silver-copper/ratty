name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - widget/Cargo.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --manifest-path ${{ matrix.manifest }} -- --check

  check:
    name: Check (${{ matrix.label }}, ${{ matrix.manifest }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        manifest:
          - Cargo.toml
          - widget/Cargo.toml
        include:
          - target: aarch64-apple-darwin
            label: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            label: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            label: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            label: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            label: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --manifest-path ${{ matrix.manifest }} --target ${{ matrix.target }}

  check-packaged-source:
    name: Check packaged-source cfg paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check with git-source cfgs forced off
        env:
          RATTY_PACKAGED_SOURCE: "1"
        run: cargo check --all-targets --locked
      # `cargo package` strips the git sources and verifies the packaged crate
      # against the crates.io releases, catching API drift the fork-based
      # check above cannot see. Its verify step builds only lib/bins, so run
      # the packaged tests too — they contain cfg'd packaged-source branches.
      - name: Verify the package builds against registry dependencies
        run: cargo package
      # Point CARGO_TARGET_DIR at the workspace target dir so this reuses the
      # artifacts the verify step just built instead of cold-building Bevy in
      # the nested dir cargo package wipes each run.
      - name: Test the packaged crate against registry dependencies
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          CARGO_TARGET_DIR="$PWD/target" \
            cargo test --lib --manifest-path "target/package/ratty-$version/Cargo.toml"

  test:
    name: Test library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run library tests
        run: cargo test --lib --locked

  clippy:
    name: Clippy (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - widget/Cargo.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --manifest-path ${{ matrix.manifest }} -- -D warnings
