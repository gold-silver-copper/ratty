[package]
name = "ratty"
version = "0.5.0"
description = "A GPU-rendered terminal emulator that supports inline 3D graphics"
authors = ["Orhun Parmaksız <orhunparmaksiz@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/orhun/ratty"
repository = "https://github.com/orhun/ratty"
keywords = ["terminal", "emulator", "3d", "graphics"]
categories = ["command-line-utilities", "graphics"]
edition = "2024"
exclude = ["website/**", ".github/**", "widget/**"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
base64 = "0.22"
bevy = { version = "0.19.0", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_log",
    "bevy_pbr",
    "bevy_scene",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_winit",
    "gltf_animation",
    "keyboard",
    "mouse",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "tonemapping_luts",
    "wayland",
    "x11",
    "zstd_rust",
] }
clap = { version = "4.5", features = ["derive"] }
etcetera = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
# Git and binary builds use the renderer's automatic cell-metric fix. Cargo
# replaces git sources with the compatible registry version when packaging;
# build.rs enables Ratty's own measured-advance adapter for that source only.
bevy_terminal_ratatui = { version = "=0.7.0", git = "https://github.com/gold-silver-copper/bevy_terminal.git", rev = "2192e8a93b54e09119bd790a1263373db8fec4fa", default-features = false, features = ["system_fonts"] }
portable-pty = "0.8"
ratatui = "0.30"
read-fonts = "0.39.2"
# The fork preserves SGR blink flags. Cargo replaces the git source with the
# exact, source-compatible registry release when packaging; build.rs detects
# that fallback so Ratty does not advertise blink flags the parser discarded.
rio-vt = { version = "=0.5.19", git = "https://github.com/gold-silver-copper/rio.git", rev = "f36b84c6e55cad97be300414774d47fa99c1790d", default-features = false }
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
shellexpand = "3.1"
stl_io = "0.11.0"
tobj = "4.0"
toml = "0.8"
winit = { version = "0.30", default-features = false }

[build-dependencies]
winresource = "0.1.31"

[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"
